name: Bug report
description: Report a reproducible problem in solana-explain.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please confirm you're on the latest version and
        search existing issues first. A signature or base64 tx we can reproduce
        with is the fastest path to a fix.
  - type: input
    id: version
    attributes:
      label: solana-explain version
      description: Output of `solana-explain --version` (or the installed package version).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one or two sentence description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        The exact command/API call and input. A transaction **signature** (mainnet)
        or a base64 transaction we can run against a public RPC is ideal. Note which
        cluster/RPC if relevant.
      placeholder: |
        solana-explain <signature> --cluster mainnet
        # or: explainTransaction(base64Tx, { rpc })
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual output
      description: What the report should have said vs. what it actually produced (paste the output / exit code).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Node version:
        - Used as library or CLI:
        - RPC provider (if relevant):
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest version, or noted the version above.
          required: true
